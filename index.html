<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NATO-alfabet</title>
<meta name="description" content="Leer het NATO-spellingsalfabet (Alfa, Bravo, Charlie) of het Nederlandse (Anton, Bernard, Cornelis). Zet tekst om, laat hem voorlezen en oefen met een quiz.">

<link rel="stylesheet" href="style.css?v=1">

<body>
<header class="top">
  <a class="brand" href="./"><span class="logo"><i class="mdi mdi-alphabetical-variant"></i></span>
    <div><b>NATO-alfabet</b><small>Spellen als een piloot</small></div></a>
  <nav>
    <button type="button" class="ib" id="theme" title="Licht / donker"><i class="mdi mdi-theme-light-dark"></i></button>
    <a href="https://uselesssite.nl/tools/" class="ghost"><i class="mdi mdi-view-grid-outline"></i> <span>Alle tools</span></a>
    <a href="https://github.com/Rein033/nato-alfabet" class="ghost"><i class="mdi mdi-github"></i> <span>GitHub</span></a>
    <a href="https://buymeacoffee.com/rein033" class="coffee" target="_blank" rel="noopener"><i class="mdi mdi-coffee"></i> <span>Koffie</span></a>
  </nav>
</header>

<main>
<div class="panel">
  <div class="btns" style="justify-content:space-between">
    <div class="seg" id="alf"><button type="button" data-v="nato" class="on">NATO (internationaal)</button><button type="button" data-v="nl">Nederlands</button></div>
    <span class="hint" style="margin:0">Tik op een kaart om hem te horen</span>
  </div>
  <div class="grid" id="grid" style="margin-top:12px"></div>
</div>
<div class="cols">
  <div class="panel">
    <div class="tile-head"><div class="tile-ic"><i class="mdi mdi-swap-horizontal"></i></div><div class="tile-txt"><b>Tekst omzetten</b><small>Bijv. je naam, postcode of een kenteken</small></div>
      <div class="btns"><button type="button" class="ib" id="spreek" title="Voorlezen"><i class="mdi mdi-volume-high"></i></button><button type="button" class="ib" id="kopie" title="Kopiëren"><i class="mdi mdi-content-copy"></i></button></div></div>
    <input id="tekst" placeholder="Typ hier…" autocomplete="off" maxlength="200">
    <div id="uit" class="uit"></div>
  </div>
  <div class="panel">
    <div class="tile-head"><div class="tile-ic"><i class="mdi mdi-school"></i></div><div class="tile-txt"><b>Oefenen</b><small id="score">Score 0 / 0 · reeks 0</small></div>
      <div class="btns"><button type="button" class="ib" id="reset" title="Opnieuw"><i class="mdi mdi-restart"></i></button></div></div>
    <div class="seg" id="qm"><button type="button" data-v="typ" class="on">Letter → woord (typen)</button><button type="button" data-v="kies">Letter → woord (kiezen)</button><button type="button" data-v="letter">Woord → letter</button></div>
    <div class="vraag" id="vraag">A</div>
    <div id="typ"><input id="antw" placeholder="Typ het woord en druk op Enter" autocomplete="off" spellcheck="false" autocapitalize="off"></div>
    <div id="kies" class="keuzes" hidden></div>
    <div id="fb" class="fb"></div>
    <div id="lastig" class="hint"></div>
  </div>
</div>
</main>

<footer>
  Gratis en open source · Gemaakt door <a href="https://github.com/Rein033">Rein033</a> · Alles gebeurt in je browser, er gaat niets naar een server ·
  <a href="https://uselesssite.nl/tools/">Meer tools</a>
</footer>
<script src="base.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
